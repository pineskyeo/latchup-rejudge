<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VT·VH 판정 조건</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 규칙 3줄 → 곡선 훑기 애니메이션(곡선 | 상태판) → 결과. 측정은 그대로, 측정 끝난 곡선을 왼쪽부터 훑는다 */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --fg:#15202b; --muted:#5d6b78; --line:#cfd7df; --grid:#e3e8ed;
  --acc:#c47600; --hot:#d93a3f; --ok:#12866a; --cool:#1f6fd0;
  --font-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d1318;--surface:#141c23;--fg:#e3eaf0;--muted:#93a2b0;--line:#28343f;--grid:#1f2a33;--acc:#f0b23e;--hot:#ff5f64;--ok:#3fd1a0;--cool:#5aa5ff;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0d1318;--surface:#141c23;--fg:#e3eaf0;--muted:#93a2b0;--line:#28343f;--grid:#1f2a33;--acc:#f0b23e;--hot:#ff5f64;--ok:#3fd1a0;--cool:#5aa5ff;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px;display:flex;flex-direction:column;gap:16px}
h1{font-size:26px;margin:0;line-height:1.25}
.sub{color:var(--muted);margin:0}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.rules{grid-template-columns:1fr}}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rule .n{font:600 12px var(--font-mono);color:var(--muted);letter-spacing:.06em}
.rule b{font-size:15px}
.rule span{font-size:13.5px;color:var(--muted)}
.mono{font-family:var(--font-mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cap{min-height:2.8em;display:flex;flex-direction:column;gap:1px}
.cap b{font-size:16px} .cap span{font-size:14px;color:var(--muted)}
svg{width:100%;height:auto;display:block}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl input{flex:1 1 220px;min-width:0;accent-color:var(--acc)}
button{font:13px var(--font-mono);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* svg */
.t{font:12.5px var(--font-sans);fill:var(--fg)} .tb{font-weight:700} .tm{fill:var(--muted)} .ts{font-size:11.5px}
.tk{font:11px var(--font-mono);fill:var(--muted)}
.ax{stroke:var(--muted);stroke-width:1} .gl{stroke:var(--grid);stroke-width:1}
.cvbg{fill:none;stroke:var(--grid);stroke-width:2.2}
.cv{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linejoin:round}
.cur{stroke:var(--fg);stroke-width:1;stroke-dasharray:2 3}
.pk{fill:none;stroke:var(--acc);stroke-width:2.2}
.vl{fill:none;stroke:var(--cool);stroke-width:2.2}
.hl{stroke-width:1.3;stroke-dasharray:5 4}
.hl.a{stroke:var(--acc)} .hl.c{stroke:var(--cool)}
.band{fill:var(--acc);opacity:.14}
.box{fill:var(--bg);stroke:var(--line)}
.bar{fill:var(--grid)} .barA{fill:var(--acc)} .barC{fill:var(--cool)}
.dep{stroke-width:9}
.dep.keep{stroke:var(--ok)} .dep.drop{stroke:var(--muted);opacity:.4}
.thr{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:5 4}
.new{fill:none;stroke:var(--ok);stroke-width:2.6}
.old{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 3}
.layer{transition:opacity .3s}
@media (prefers-reduced-motion: reduce){.layer{transition:none}}
</style>

<div class="wrap">
  <h1>VT·VH 판정 조건</h1>
  <p class="sub">측정은 기존과 같습니다. sweep이 끝난 뒤 저장된 곡선을 왼쪽부터 한 번 훑으며 판정합니다.</p>

  <div class="rules">
    <div class="rule"><span class="n">① snapback 인정</span><b>꼭대기에서 기준보다 더 떨어짐</b><span>기준 = <span class="mono">max(50 mV, 꼭대기×3%)</span>. 누적 낙폭으로 봄</span></div>
    <div class="rule"><span class="n">② snapback 종료</span><b>골에서 50 mV 넘게 다시 오름</b><span>래치 해제가 아니라, 이 snapback 하나를 닫는 것</span></div>
    <div class="rule"><span class="n">③ 선택</span><b>깊이 ≥ 최대 깊이×70% 중 꼭대기 최고</b><span>그 꼭대기 = VT, 그 골 = VH</span></div>
  </div>

  <div class="panel" id="sc">
    <div class="ctl" role="group" aria-label="단계">
      <button data-j="scan">훑기</button><button data-j="depth">깊이 비교</button><button data-j="pick" aria-pressed="true">결과</button>
    </div>
    <div class="cap" aria-live="polite"><b id="capT"></b><span id="capS"></span></div>
    <svg id="cv" viewBox="0 0 900 400" role="img" aria-label="force-I 곡선을 왼쪽부터 훑는 판정. 꼭대기 후보와 골 후보가 갱신되고, 1.22 V와 1.66 V에서 snapback 두 개를 찾는다. 깊이 0.20 V는 기준 0.34 V 미만이라 빠지고 VT 1.66 V, VH 1.18 V가 선택된다"></svg>
    <div class="ctl"><button id="play" aria-label="재생">▶</button><input id="rg" type="range" min="0" max="1000" value="1000" aria-label="시점"></div>
  </div>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const E=(t,a,p,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e;};

/* curve: same shape as the other pages (1st 1.22 V, 2nd 1.66 V, hold 1.18 V), ×1.05 points */
const u1=-3.6,u2=-2.82,uEnd=Math.log10(2e-2);
const Vof=u=>{if(u<=u1){const r=(u+7)/(u1+7);return 0.2+1.02*Math.pow(r,1.6);}
  if(u<=u2)return 1.00+(1.66-1.00)*(u-u1)/(u2-u1);
  return 1.18+48*Math.max(0,Math.pow(10,u)-Math.pow(10,u2+0.03));};
const P=[];for(let I=1e-7*1.05;Math.log10(I)<=uEnd;I*=1.05)P.push({u:Math.log10(I),I,V:Vof(Math.log10(I))});
const v=P.map(p=>p.V),N=v.length,START=6,DA=0.05,DR=0.03,MF=0.7;
const thrOf=pk=>Math.max(DA,DR*Math.abs(pk));

/* run the rule point by point and keep the state after each point */
const ST=[];{let down=false,imax=START,imin=START,pk=START,ev=[];
  for(let j=0;j<N;j++){
    if(j>START){
      if(!down){if(v[j]>=v[imax])imax=j;else if(v[imax]-v[j]>thrOf(v[imax])){down=true;pk=imax;imin=j;}}
      else{if(v[j]<=v[imin])imin=j;else if(v[j]-v[imin]>DA){ev.push([pk,imin]);down=false;imax=j;}}
    }
    ST.push({j,down,imax,imin,pk,ev:ev.slice()});
  }
  if(down)ST[N-1].ev.push([pk,imin]);}
const EV=ST[N-1].ev,DEP=EV.map(([p,q])=>v[p]-v[q]),DMAX=Math.max(...DEP);
let BEST=-1;EV.forEach(([p],k)=>{if(DEP[k]>=MF*DMAX&&(BEST<0||v[p]>v[EV[BEST][0]]))BEST=k;});
/* legacy rule for comparison */
let LT=-1,LH=-1;{let kk=0;const d=j=>j<1?0:v[j]-v[j-1];
  for(let j=START;j<N;j++)if(d(j)*d(j-1)<0){LT=j-1;kk=j;break;}
  for(let j=kk+1;j<N;j++)if(j>2&&d(j)*d(j-1)<0){LH=j-1;break;}}

/* drawing */
const S=document.getElementById('cv');
const X0=60,X1=600,Y0=350,Y1=26,umin=-7,vmax=2.2;
const sx=u=>X0+(u-umin)/(uEnd-umin)*(X1-X0),sy=V=>Y0-V/vmax*(Y0-Y1);
const LOG=[[-7,'100n'],[-6,'1µ'],[-5,'10µ'],[-4,'100µ'],[-3,'1m'],[-2,'10m']];
LOG.forEach(([d,s])=>{E('line',{x1:sx(d),x2:sx(d),y1:Y1,y2:Y0,class:'gl'},S);E('text',{x:sx(d),y:Y0+16,'text-anchor':'middle',class:'tk'},S,s);});
for(let V=0;V<=2;V+=0.5){E('line',{x1:X0,x2:X1,y1:sy(V),y2:sy(V),class:'gl'},S);E('text',{x:X0-6,y:sy(V)+4,'text-anchor':'end',class:'tk'},S,V.toFixed(1));}
E('line',{x1:X0,x2:X1,y1:Y0,y2:Y0,class:'ax'},S);E('line',{x1:X0,x2:X0,y1:Y1,y2:Y0,class:'ax'},S);
E('text',{x:X1,y:Y0+34,'text-anchor':'end',class:'t tm ts'},S,'설정 IO 전류 (×1.05 스텝) →');
E('text',{x:X0-44,y:Y1-8,class:'t tm ts'},S,'측정 V');
const pts=(a,b)=>P.slice(a,b+1).map(p=>sx(p.u).toFixed(1)+','+sy(p.V).toFixed(1)).join(' ');
E('polyline',{points:pts(0,N-1),class:'cvbg'},S);
const gBand=E('g',null,S);
const cvDone=E('polyline',{class:'cv'},S);
const lPk=E('line',{class:'hl a'},S),lThr=E('line',{class:'hl a',opacity:.6},S),lVl=E('line',{class:'hl c'},S);
const tThr=E('text',{class:'tk',style:'fill:var(--acc)'},S),tEnd=E('text',{class:'tk',style:'fill:var(--cool)'},S);
const cPk=E('circle',{r:7,class:'pk'},S),cVl=E('circle',{r:7,class:'vl'},S);
const cur=E('line',{y1:Y1,y2:Y0,class:'cur'},S);

/* state board (right) */
const BX=630,BW=250;
const board=E('g',{class:'layer'},S);
E('rect',{x:BX,y:26,width:BW,height:200,rx:8,class:'box'},board);
const row=(y,k)=>{E('text',{x:BX+12,y,class:'t tm ts'},board,k);return E('text',{x:BX+BW-12,y,'text-anchor':'end',class:'t tb mono'},board,'');};
const bMode=row(52,'상태'),bPk=row(78,'꼭대기 후보'),bVl=row(104,'골 후보');
E('text',{x:BX+12,y:132,class:'t tm ts'},board,'낙폭 / 기준');
E('rect',{x:BX+12,y:140,width:BW-24,height:10,rx:3,class:'bar'},board);
const bDrop=E('rect',{x:BX+12,y:140,width:0,height:10,rx:3,class:'barA'},board);
const bThrMk=E('line',{y1:136,y2:154,stroke:'currentColor',style:'stroke:var(--fg)','stroke-width':2},board);
const bDropT=E('text',{x:BX+BW-12,y:132,'text-anchor':'end',class:'tk'},board,'');
const bFound=row(184,'찾은 snapback');
const bList=E('text',{x:BX+12,y:208,class:'tk'},board,'');

/* depth comparison (right) */
const dep=E('g',{class:'layer'},S);
E('text',{x:BX+12,y:52,class:'t tm ts'},dep,'깊이 = 꼭대기 − 골');
const DS=v=>v/0.6*130,DY=230;
EV.forEach((e,k)=>{const x=BX+50+k*80;
  E('line',{x1:x,x2:x,y1:DY,y2:DY-DS(DEP[k]),class:'dep '+(DEP[k]>=MF*DMAX?'keep':'drop')},dep);
  E('text',{x,y:DY+16,'text-anchor':'middle',class:'tk'},dep,'#'+(k+1));
  E('text',{x,y:DY-DS(DEP[k])-6,'text-anchor':'middle',class:'tk'},dep,DEP[k].toFixed(2)+' V');});
E('line',{x1:BX+20,x2:BX+BW-20,y1:DY-DS(MF*DMAX),y2:DY-DS(MF*DMAX),class:'thr'},dep);
E('text',{x:BX+BW-20,y:DY-DS(MF*DMAX)-5,'text-anchor':'end',class:'tk',style:'fill:var(--acc)'},dep,'70% = '+(MF*DMAX).toFixed(2));

/* result marks */
const res=E('g',{class:'layer'},S);
const mk=(j,cls,label,dx,dy,col)=>{E('circle',{cx:sx(P[j].u),cy:sy(v[j]),r:8,class:cls},res);E('text',{x:sx(P[j].u)+dx,y:sy(v[j])+dy,'text-anchor':dx<0?'end':'start',class:'t tb ts',style:'fill:'+col},res,label);};
mk(LT,'old','기존 VT '+v[LT].toFixed(2),-12,-10,'var(--muted)');
mk(LH,'old','기존 VH '+v[LH].toFixed(2),-12,20,'var(--muted)');
mk(EV[BEST][0],'new','VT '+v[EV[BEST][0]].toFixed(2),-12,-12,'var(--ok)');
mk(EV[BEST][1],'new','VH '+v[EV[BEST][1]].toFixed(2),14,18,'var(--ok)');

/* timeline: fast through the plain rise, slow around the snapbacks */
const SLOW=EV[0][0]-14,TS1=1.6,TS2=9,TD=2.2,TP=2.2,TOT=TS1+TS2+TD+TP;
const jAt=t=>{if(t<=TS1)return Math.round(START+(SLOW-START)*t/TS1);if(t<=TS1+TS2)return Math.round(SLOW+(N-1-SLOW)*(t-TS1)/TS2);return N-1;};
const xe=k=>Math.min(sx(P[Math.min(N-1,k+25)].u),X1-52);
const capT=document.getElementById('capT'),capS=document.getElementById('capS');
const bands=[];
function setCap(a,b){if(capT.textContent!==a)capT.textContent=a;if(capS.textContent!==b)capS.textContent=b;}
function show(el,on){el.setAttribute('opacity',on?1:0);}
function render(t){
  const scanning=t<TS1+TS2,ph=scanning?0:t<TS1+TS2+TD?1:2;
  const j=jAt(Math.min(t,TS1+TS2)),s=ST[j];
  cvDone.setAttribute('points',pts(0,j));
  const x=sx(P[j].u);cur.setAttribute('x1',x);cur.setAttribute('x2',x);show(cur,scanning);
  // bands for found snapbacks
  while(bands.length<s.ev.length){const [p,q]=EV[bands.length];const x0=sx(P[p].u)-8,x1=sx(P[q].u)+8;
    const g=E('g',null,gBand);E('rect',{x:x0,y:sy(v[p])-10,width:x1-x0,height:sy(v[q])-sy(v[p])+20,rx:4,class:'band'},g);
    E('text',{x:x0-4,y:sy(v[p])-14,'text-anchor':'end',class:'t tb ts'},g,'#'+(bands.length+1));bands.push(g);}
  while(bands.length>s.ev.length)bands.pop().remove();
  // candidate marks
  const up=!s.down;
  const pkj=up?s.imax:s.pk,thr=thrOf(v[pkj]);
  cPk.setAttribute('cx',sx(P[pkj].u));cPk.setAttribute('cy',sy(v[pkj]));show(cPk,scanning);
  lPk.setAttribute('x1',sx(P[pkj].u));lPk.setAttribute('x2',xe(pkj));lPk.setAttribute('y1',sy(v[pkj]));lPk.setAttribute('y2',sy(v[pkj]));
  lThr.setAttribute('x1',sx(P[pkj].u));lThr.setAttribute('x2',xe(pkj));lThr.setAttribute('y1',sy(v[pkj]-thr));lThr.setAttribute('y2',sy(v[pkj]-thr));
  tThr.setAttribute('x',xe(pkj)+4);tThr.setAttribute('y',sy(v[pkj]-thr)+4);tThr.textContent='−'+Math.round(thr*1000)+' mV';
  [lPk,lThr,tThr].forEach(e=>show(e,scanning&&up));
  cVl.setAttribute('cx',sx(P[s.imin].u));cVl.setAttribute('cy',sy(v[s.imin]));show(cVl,scanning&&s.down);
  lVl.setAttribute('x1',sx(P[s.imin].u));lVl.setAttribute('x2',xe(s.imin));lVl.setAttribute('y1',sy(v[s.imin]+DA));lVl.setAttribute('y2',sy(v[s.imin]+DA));
  tEnd.setAttribute('x',xe(s.imin)+4);tEnd.setAttribute('y',sy(v[s.imin]+DA)+4);tEnd.textContent='+50 mV';
  [lVl,tEnd].forEach(e=>show(e,scanning&&s.down));
  // board
  bMode.textContent=up?'오르는 중':'떨어지는 중';bMode.style.fill=up?'var(--acc)':'var(--cool)';
  bPk.textContent=v[pkj].toFixed(2)+' V';bVl.textContent=s.down?v[s.imin].toFixed(2)+' V':'–';
  const drop=up?Math.max(0,v[s.imax]-v[j]):v[s.pk]-v[s.imin],ref=up?thr:DA,full=BW-24,scale=full/Math.max(0.6,drop*1.1);
  bDrop.setAttribute('width',Math.min(full,drop*scale));bDrop.setAttribute('class',up?'barA':'barC');
  const mx=BX+12+Math.min(full,ref*scale);bThrMk.setAttribute('x1',mx);bThrMk.setAttribute('x2',mx);
  bDropT.textContent=up?(Math.round(drop*1000)+' / '+Math.round(thr*1000)+' mV'):('재상승 '+Math.round(Math.max(0,v[j]-v[s.imin])*1000)+' / 50 mV');
  const evs=scanning?s.ev:EV;
  bFound.textContent=evs.length+'개';
  bList.textContent=evs.map(([p,q],k)=>'#'+(k+1)+' '+v[p].toFixed(2)+'→'+v[q].toFixed(2)).join('   ');
  show(board,ph===0);show(gBand,ph<2);show(dep,ph>=1);show(res,ph===2);
  document.querySelectorAll('[data-j]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.j===['scan','depth','pick'][ph]?'true':'false'));
  if(ph===0){
    if(up)setCap('오르는 중: 꼭대기 후보 갱신','더 높은 점이 나오면 꼭대기 후보를 바꾼다. 꼭대기에서 누적으로 '+Math.round(thr*1000)+' mV 넘게 떨어지면 snapback');
    else setCap('떨어지는 중: 골 후보 갱신','더 낮은 점이 나오면 골 후보를 바꾼다. 골에서 50 mV 넘게 오르면 이 snapback을 닫고 꼭대기를 새로 찾는다');
    if(j>EV[EV.length-1][1]+3&&up)setCap('홀드 구간: 계속 오르기만 함','전압이 가장 높아도 뒤에 떨어지는 구간이 없어서 snapback이 아니다');
  }else if(ph===1)setCap('깊이 비교','가장 깊은 것('+DMAX.toFixed(2)+' V)의 70% = '+(MF*DMAX).toFixed(2)+' V 이상만 후보. #1 '+DEP[0].toFixed(2)+' V는 탈락');
  else setCap('결과: 후보 중 꼭대기 최고','VT '+v[EV[BEST][0]].toFixed(2)+' V, VH '+v[EV[BEST][1]].toFixed(2)+' V. 기존 규칙은 첫 꺾임 '+v[LT].toFixed(2)+' / '+v[LH].toFixed(2)+' V');
}

/* player */
const rg=document.getElementById('rg'),btn=document.getElementById('play');
let t=TOT,raf=0,last=0;
function seek(x){t=Math.max(0,Math.min(TOT,x));rg.value=Math.round(t/TOT*1000);render(t);}
function stop(){cancelAnimationFrame(raf);raf=0;btn.textContent='▶';btn.setAttribute('aria-label','재생');}
function loop(ts){if(!last)last=ts;const dt=(ts-last)/1000;last=ts;if(t+dt>=TOT){seek(TOT);stop();return;}seek(t+dt);raf=requestAnimationFrame(loop);}
btn.addEventListener('click',()=>{if(raf){stop();return;}if(t>=TOT)t=0;last=0;btn.textContent='❚❚';btn.setAttribute('aria-label','일시정지');raf=requestAnimationFrame(loop);});
rg.addEventListener('input',()=>{stop();seek(rg.value/1000*TOT);});
document.querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>{stop();
  const k=b.dataset.j;if(k==='scan'){seek(0);if(!RM)btn.click();}else seek(k==='depth'?TS1+TS2+0.5:TOT);}));
seek(TOT);
})();
</script>
