<div class="wrap">
  <h1>force-I vs force-V</h1>
  <div class="two">
    <div class="panel"><svg id="wI" viewBox="0 0 460 470" role="img" aria-label="force-I: x는 설정 전류, y는 측정 전압. 전압이 두 번 떨어지는 톱니 모양으로 1차·2차 꼭대기와 골, Vh가 한 번의 sweep에 모두 나온다. 아래는 스텝별 전력이 매끈하게 증가"></svg></div>
    <div class="panel"><svg id="wV" viewBox="0 0 460 470" role="img" aria-label="force-V: x는 설정 전압, y는 측정 전류. 올릴 때 1.22 V와 1.66 V에서 전류가 수직으로 점프하고, Vh와 골은 내릴 때 따로 떨어지는 지점으로만 나온다. 아래 전력은 점프에서 한 번에 튄다"></svg></div>
  </div>
  <div class="two">
    <div class="panel"><svg id="pI" viewBox="0 0 460 720" role="img" aria-label="force-I: 전류를 5%씩 올리며 전압을 읽음. 1차·2차 꼭대기와 골, Vh까지 전부 기록되고 전류가 천천히 오른다"></svg></div>
    <div class="panel"><svg id="pV" viewBox="0 0 460 720" role="img" aria-label="force-V: 전압을 올리며 전류를 읽음. 1.22 V와 1.66 V에서 전류가 점프하고 골과 Vh가 기록되지 않으며 순간 전력이 튄다"></svg></div>
  </div>
  <div class="panel ctl"><button id="play" type="button" aria-label="일시정지">❚❚</button><input id="rg" type="range" min="0" max="1000" value="0" aria-label="시점"></div>
</div>
<script>
(()=>{

/* force-I: 100 nA x1.05 per step up to 50 mA */
const SI=[];for(let u=-7;u<=UEND+1e-9;u+=Math.log10(1.05))SI.push({u,V:Vc(u)});

  E('line',{x1:300,y1:18,x2:322,y2:18,class:'bg'},svg);T(svg,326,22,'소자 특성','tick');
  E('line',{x1:382,y1:18,x2:404,y2:18,class:'cv'},svg);T(svg,408,22,'기록','tick b');

  T(svg,10,334,'I','lbl b');E('rect',{x:BX0,y:322,width:BX1-BX0,height:16,rx:4,class:'trk'},svg);const bI=E('rect',{x:BX0,y:322,width:0,height:16,rx:4,class:'bI'},svg);
  T(svg,10,370,'P','lbl b');E('rect',{x:BX0,y:358,width:BX1-BX0,height:16,rx:4,class:'trk'},svg);const bP=E('rect',{x:BX0,y:358,width:0,height:16,rx:4,class:'bP'},svg);

  E('rect',{x:378,y:328,width:44,height:44,rx:5,class:'chipbox'},svg);
  [336,346,356,366].forEach(y=>{E('line',{x1:370,y1:y,x2:378,y2:y,class:'mk'},svg);E('line',{x1:422,y1:y,x2:430,y2:y,class:'mk'},svg);});

/* ===== sweep value (x) -> measured value (y) ===== */
(function(){

  const ax=(svg,c)=>{const X=c.X,Y=c.Y;
    c.xt.forEach(t=>{E('line',{x1:X(t[0]),y1:c.t,x2:X(t[0]),y2:c.b,class:'gl'},svg);T(svg,X(t[0]),c.b+15,t[1],'tick',{'text-anchor':'middle'});});

    E('line',{x1:c.l,y1:c.b,x2:c.r,y2:c.b,class:'ax'},svg);E('line',{x1:c.l,y1:c.t,x2:c.l,y2:c.b,class:'ax'},svg);
    T(svg,c.r,c.b+30,c.xl,'tick b',{'text-anchor':'end'});T(svg,c.l-4,c.t-8,c.yl,'tick b');};
  const pl=(svg,pts,cls,ex)=>{ex=ex||{};const st=ex.stroke?'stroke:'+ex.stroke+(ex.w?';stroke-width:'+ex.w:'')+(ex.op?';opacity:'+ex.op:''):'';return E('polyline',{points:pts.map(p=>f1(p[0])+','+f1(p[1])).join(' '),class:cls,style:st},svg);};
  const lab=(svg,x,y,s,col,anc)=>T(svg,x,y,s,'tick b',{fill:col,'text-anchor':anc||'start'});
  const OK='var(--ok)',HOT='var(--hot)',COOL='var(--cool)';
